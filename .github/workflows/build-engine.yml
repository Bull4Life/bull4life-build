name: Build engine app
# Public CI (FREE minutes) builds THE ONE PROGRAM (engine app: node + B4L chain + UI in-process) into a single binary
# per OS — Windows .exe (native WebView2 window), macOS .app (native WKWebView window), Linux (opens the dashboard in the
# user's browser via the app's built-in fallback — the GTK/webkit backend is unreliable to build + needs webkit2gtk on
# the user's box). Off Master's laptop, out of the billed private repo. Engine source cloned READ-ONLY, compiled, discarded.
# fail-fast:false → each OS builds independently (a Mac/Linux hiccup never blocks the Windows binary).
on:
  workflow_dispatch:
jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: windows-x64
            out: Bull4LifeEngine-windows.zip
          - runner: macos-latest
            arch: macos-arm64
            out: Bull4LifeEngine-macos.app
          - runner: ubuntu-latest
            arch: linux-x64
            out: Bull4LifeEngine-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone private engine source (read-only token, never logged)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.ENGINE_TOKEN }}@github.com/Bull4Life/bull4life-engine.git" engine 2>/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps (+ the native-window backend for THIS OS)
        run: |
          pip install "nuitka[onefile]" zstandard numpy pandas psutil cryptography certifi requests
          case "${{ matrix.runner }}" in
            windows-latest) pip install pywebview pythonnet pystray pillow ;;                               # WebView2 native window + pystray/PIL tray Quit (close/stop-donation control)
            macos-latest)   pip install pywebview pyobjc-framework-WebKit pyobjc-framework-Cocoa imageio pystray pillow ;; # WKWebView + imageio (Nuitka PNG->.icns app icon) + tray
            ubuntu-latest)  pip install pystray pillow ; echo "linux: no pywebview — the app opens the dashboard in the user's browser (fallback) + tray Quit" ;;
          esac
      - name: Build (Nuitka)
        working-directory: engine
        run: python build_engine_app.py
      - name: Locate binary / bundle
        working-directory: engine
        run: |
          out="$PWD/../${{ matrix.out }}"
          # Prefer the concrete single artifact (macOS .app bundle, linux/onefile binary) — only fall back to
          # zipping the --standalone .dist FOLDER (the Windows native-window build, exe nested inside .dist).
          f=""
          for c in dist/engine_app.app dist/engine_app.exe dist/Bull4LifeEngine.exe dist/engine_app.bin dist/engine_app; do
            if [ -e "$c" ]; then f="$c"; break; fi
          done
          if [ -n "$f" ]; then
            cp -r "$f" "$out"
            chmod +x "$out" 2>/dev/null || true
            echo "bundled $f -> ${{ matrix.out }} ($(du -sh "$out" | cut -f1))"
          elif [ -d dist/engine_app.dist ] && [ -n "$(ls -A dist/engine_app.dist 2>/dev/null)" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              powershell -NoProfile -Command "Compress-Archive -Path 'dist/engine_app.dist/*' -DestinationPath '../${{ matrix.out }}' -Force"
            else
              ( cd dist/engine_app.dist && zip -qr "$out" . )
            fi
            echo "zipped standalone folder -> ${{ matrix.out }} (unpacked $(du -sh dist/engine_app.dist | cut -f1))"
          else
            echo "no binary"; ls -la dist || true; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          retention-days: 14
