name: Build inference (7B Army - Slice 1 smoke)
# 7B-Army fleet inference, Slice 1: prove the runtime works on a Linux runner.
# Build llama.cpp from source (CPU) + smoke-test Qwen2.5-Coder-7B-Instruct loads and returns tokens.
# actions/cache the ~4.7GB GGUF: download-from-source ONCE, restore fast on later runs (fixes ephemeral-runner re-download).
# CPU-only. No laptop. No secrets. Part of the 7B-Army build (engine, Master GO 2026-08-20).
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_REPO: Qwen/Qwen2.5-Coder-7B-Instruct-GGUF
      MODEL_FILE: qwen2.5-coder-7b-instruct-q4_k_m.gguf
    steps:
      - name: Cache model GGUF (persist across ephemeral runners)
        id: modelcache
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.MODEL_FILE }}
      - name: Download model (only on cache miss)
        if: steps.modelcache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p models
          echo "cache MISS - downloading $MODEL_FILE (~4.7GB) from HuggingFace (resumable)..."
          curl -L --fail --retry 5 --retry-delay 5 -C - -o "models/$MODEL_FILE" \
            "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE?download=true"
      - name: Verify model present
        run: ls -la models/ && du -h "models/$MODEL_FILE"
      - name: Build llama.cpp from source (CPU)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build -j"$(nproc)" --target llama-cli
          CLI=$(find llama.cpp/build -name 'llama-cli' -type f | head -1)
          test -n "$CLI" || { echo "FAIL: llama-cli not built"; find llama.cpp/build -name 'llama*' -type f; exit 1; }
          echo "built: $CLI"
          echo "LLAMA_CLI=$CLI" >> $GITHUB_ENV
      - name: SMOKE - model loads + returns tokens
        run: |
          set -e
          echo "=== running inference (coder prompt) ==="
          OUT=$("$LLAMA_CLI" -m "models/$MODEL_FILE" \
                -p "Write a one-line Python function that returns the square of n." \
                -n 64 -no-cnv --no-display-prompt 2>err.log) || { echo "run failed:"; tail -25 err.log; exit 1; }
          echo "--- output ---"; echo "$OUT"; echo "--------------"
          if [ -z "$(echo "$OUT" | tr -d '[:space:]')" ]; then echo "FAIL: empty output"; tail -25 err.log; exit 1; fi
          echo ""
          echo "PASS: llama.cpp + Qwen2.5-Coder-7B loaded and returned tokens on a CPU Linux runner."
          echo "7B-Army Slice 1 runtime proven. Cache warm for next run."
