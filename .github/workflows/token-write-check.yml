name: token-write-check
on: {workflow_dispatch: {}}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/Bull4Life/bull4life-engine.git" e 2>/dev/null
          cd e && git config user.name x && git config user.email x@x
          if git push --dry-run origin HEAD:master 2>er; then echo "TOKENRESULT WRITE-OK"; else echo "TOKENRESULT READ-ONLY"; cat er; fi
        env: {ENGINE_TOKEN: "${{ secrets.ENGINE_TOKEN }}"}
