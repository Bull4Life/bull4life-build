name: token-write-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Does ENGINE_TOKEN have WRITE to the private engine?
        run: |
          git clone --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/Bull4Life/bull4life-engine.git" e 2>/dev/null
          cd e && git config user.name x && git config user.email x@x
          if git push --dry-run origin HEAD:master 2>err.txt; then
            echo "RESULT: ENGINE_TOKEN HAS WRITE (push authorized)"
          else
            echo "RESULT: ENGINE_TOKEN IS READ-ONLY — needs Contents:Read+Write"; cat err.txt
          fi
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
