name: Verify + mint (public, reliable)
# Public CI = FREE unlimited minutes AND reliable scheduling. The private bull4life-engine repo silently SKIPS
# its scheduled runs (GitHub throttles private-repo schedules) + caps free minutes + queues behind the org pool —
# which repeatedly stalled minting. This moves the verify+mint brain here: it clones the private engine source
# READ+WRITE via ENGINE_TOKEN (source discarded with the runner, never committed/logged here), pulls the
# coordinator candles (fixes Binance-451), re-runs the DETERMINISTIC verify (strategy_plan --once --no-deliver),
# mints B4L, and pushes ONLY the chain + credits back to the private repo. Replaces bull4life-engine/verify-pool.yml
# (whose schedule gets disabled once this is confirmed live).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # every 3h — public schedules fire reliably; tighter than the old (skipped) 6h
concurrency:
  group: verify-mint
  cancel-in-progress: false
jobs:
  verify-mint:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # verify-pool re-runs ~162 strategies (progressing, not hung) + can exceed 90m; give
                           # it room so the run REACHES drain+mint+push (a 90m timeout was killing every run in
                           # verify-pool → chain froze at h161 with no block ever minted). Public CI = free minutes.
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone private engine source (read+write token, never logged)
        run: |
          git clone "https://x-access-token:${ENGINE_TOKEN}@github.com/Bull4Life/bull4life-engine.git" engine 2>/dev/null
          cd engine && git config user.name "Bull4Life CI (public mint)" && git config user.email "dmanobela@gmail.com"
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: engine
        run: pip install -r requirements-node.txt ccxt
      - name: Cache coordinator candles (delta top-up after first run)
        uses: actions/cache@v4
        with:
          path: ~/b4l_candles
          key: b4l-candles-${{ github.run_id }}
          restore-keys: |
            b4l-candles-
      - name: Pull coordinator candles (avoid Binance-451 → the ~54 skipped targets mint)
        working-directory: engine
        env:
          B4L_COORDINATOR: https://compute.bull4life.com
        run: |
          mkdir -p "$HOME/b4l_candles"
          echo "B4L_CANDLE_DIR=$HOME/b4l_candles" >> "$GITHUB_ENV"
          B4L_CANDLE_DIR="$HOME/b4l_candles" python tools/ci_pull_candles.py || true
      - name: Verify the pool (re-run donated diamonds → merge winners → BANK CREDITS) — NO deliver (HOLD)
        working-directory: engine
        env:
          B4L_COORDINATOR: https://compute.bull4life.com
          B4L_DRAIN_TOKEN: ${{ secrets.B4L_DRAIN_TOKEN }}
        run: python strategy_plan.py --once --no-deliver || true
      - name: Land queued signed txs (bot records / names / transfers — the on-chain OMNI lane #65)
        working-directory: engine
        env:
          B4L_COORDINATOR: https://compute.bull4life.com
          B4L_DRAIN_TOKEN: ${{ secrets.B4L_DRAIN_TOKEN }}
        run: |
          python b4l_chain/chain.py --drain || true
      - name: Genesis-A launch allocation (once — 80k owner + 920k MM = 1M)
        working-directory: engine
        run: |
          # __B4L_GENESIS_ALLOC__ idempotent: append refuses a 2nd alloc, safe no-op after the first. Sole-writer, no fork.
          python b4l_chain/chain.py --alloc || true
      - name: Mint B4L (append PoVC blocks) + VERIFY-GATE
        working-directory: engine
        run: |
          python b4l_chain/chain.py --mint || true
          echo "--- verify GATES the push (chain.py --verify exits non-zero on an invalid chain) ---"
          python b4l_chain/chain.py --verify || { echo "POST-MINT VERIFY FAILED -> aborting before push (never push an invalid chain)"; exit 1; }
      - name: Commit + push (verify-gated, re-mint-on-divergence)
        working-directory: engine
        run: |
          _stage(){ for p in strategies compute/verified_credits.json compute/grid_results b4l_chain/b4l_chain.jsonl b4l_chain/pending_tx.jsonl; do git add "$p" 2>/dev/null || true; done; }
          _stage
          echo "--- chain tip on disk ---"; tail -1 b4l_chain/b4l_chain.jsonl 2>/dev/null | head -c 200; echo
          if git diff --cached --quiet; then echo "no new mint this run"; exit 0; fi
          git commit -m "CI verify+mint (public): banked credits + minted B4L blocks [skip ci]"
          # 2026-08-09 h175 BREAK FIX: the old rebase-only push rebased a mint block onto a changed tip (e.g. the alloc)
          # WITHOUT recomputing total_b4l -> pushed an unverifiable chain. Now: on any push rejection, RE-MINT on the
          # fresh origin tip (reset + recompute total_b4l), never rebase a stale block; and VERIFY-GATE every push.
          pushed=0
          for i in 1 2 3 4 5 6; do
            if git push origin HEAD:master; then echo "pushed (attempt $i)"; pushed=1; break; fi
            echo "push rejected attempt $i -> RE-MINT on fresh origin tip (never rebase a stale total_b4l)"
            cp -f compute/verified_credits.json /tmp/vc.json 2>/dev/null || true
            git fetch origin master -q || true
            git reset --hard origin/master -q
            cp -f /tmp/vc.json compute/verified_credits.json 2>/dev/null || true
            python b4l_chain/chain.py --drain || true
            python b4l_chain/chain.py --alloc || true
            python b4l_chain/chain.py --mint || true
            python b4l_chain/chain.py --verify || { echo "recomputed chain invalid -> abort push"; exit 1; }
            _stage
            if git diff --cached --quiet; then echo "nothing new to mint on fresh tip"; pushed=1; break; fi
            git commit -m "CI verify+mint (public): re-minted on fresh tip [skip ci]"
            sleep 3
          done
          [ "$pushed" = 1 ] || { echo "PUSH FAILED after retries -> next mint re-mints (credits persist)"; exit 1; }
